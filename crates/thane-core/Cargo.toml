[package]
name = "thane-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic business logic for thane"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
dirs.workspace = true
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
whoami = "1"
regex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
# Parse macOS Managed Preferences plist for enterprise policy overrides.
plist = "1"

[dev-dependencies]
tempfile = "3"
