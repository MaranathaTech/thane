[package]
name = "thane-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless background daemon for thane queue + IPC"

[[bin]]
name = "thane-daemon"
path = "src/main.rs"

[lib]
name = "thane_daemon"
path = "src/lib.rs"

[dependencies]
thane-core.workspace = true
thane-rpc.workspace = true
thane-ipc.workspace = true
thane-persist.workspace = true
thane-platform.workspace = true
thane-audit-sink = { workspace = true, features = ["all-sinks"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
